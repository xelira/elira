[package]
name = "elira-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
elira = { path = "../crates/elira" }
elira-accesslog = { path = "../crates/elira-accesslog" }
elira-config = { path = "../crates/elira-config" }
elira-fastcgi = { path = "../crates/elira-fastcgi" }
elira-migrate = { path = "../crates/elira-migrate" }
elira-module = { path = "../crates/elira-module" }
elira-proxy = { path = "../crates/elira-proxy" }
http = "1"
libfuzzer-sys = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "io-util"] }

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false

[[bin]]
name = "migrate"
path = "fuzz_targets/migrate.rs"
test = false
doc = false

[[bin]]
name = "headers"
path = "fuzz_targets/headers.rs"
test = false
doc = false

[[bin]]
name = "proxy_protocol"
path = "fuzz_targets/proxy_protocol.rs"
test = false
doc = false

[[bin]]
name = "fastcgi_target"
path = "fuzz_targets/fastcgi_target.rs"
test = false
doc = false

[[bin]]
name = "accesslog_format"
path = "fuzz_targets/accesslog_format.rs"
test = false
doc = false

[[bin]]
name = "module_json"
path = "fuzz_targets/module_json.rs"
test = false
doc = false

[profile.release]
debug = 1

# Keep this package out of the main workspace.
[workspace]
