listen = "127.0.0.1:8080"

[limits]
max_headers = 64
max_header_bytes = 16384
upstream_timeout_secs = 30
max_connections = 1024

# [tls]
# cert = "/etc/elira/cert.pem"
# key = "/etc/elira/key.pem"

[log]
format = "text"   # or "json"

