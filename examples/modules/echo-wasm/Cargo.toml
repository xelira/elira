[package]
name = "elira-echo-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "elira_echo_wasm"
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# This example is loaded by path, not by the Elira workspace. The empty table
# keeps cargo from looking for the repository root manifest when this crate is
# built on its own.
[workspace]
