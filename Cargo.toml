[workspace]
resolver = "2"
members = ["crates/elira", "crates/elira-config", "crates/elira-proxy"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xelira/elira"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal", "time"] }
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "client-legacy", "http1"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
