# This crate inherits the root workspace settings and dependencies. The root
# manifest owner still has to add `crates/elira-h2` to `workspace.members`
# before it can be built from the repository root.
[package]
name = "elira-h2"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bytes = { workspace = true }
elira-upstream = { path = "../elira-upstream" }
futures-util = { workspace = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-rustls = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
elira-tls = { path = "../elira-tls" }
