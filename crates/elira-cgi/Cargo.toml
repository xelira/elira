[package]
name = "elira-cgi"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/xelira/elira"
description = "CGI/1.1 runner used by the elira proxy"
publish = false

[dependencies]
thiserror = "2"
tokio = { version = "1", features = [
    "process",
    "io-util",
    "time",
    "macros",
    "rt-multi-thread",
    "sync",
] }
